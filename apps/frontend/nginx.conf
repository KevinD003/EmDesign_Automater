# Static serving for the built SPA, plus an /api and /health proxy so the
# browser talks to one origin (no CORS in the container deployment).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached: it is what points at the hashed bundles,
    # so a stale copy pins users to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A digitize of a large photo runs into the minutes; the default 60s
        # read timeout would cut it off mid-render and show the user a 504
        # while the server was still working.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Matches BodySizeLimitMiddleware's 20MB cap (CTO A11) so an oversized
        # upload gets the app's JSON 413 instead of nginx's HTML one.
        client_max_body_size 20m;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # SPA history fallback — every non-file route renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
