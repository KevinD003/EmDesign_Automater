# STITCHIQ CI — runs backend pytest + frontend vitest/typecheck/build.
name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # MUST match the venv the stream locks/baselines were pinned on
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements-dev.txt
            apps/backend/requirements-features.txt
      # rlPyCairo (the Part 25 SVG rasterizer, in core requirements) builds
      # pycairo from source, which needs the system cairo headers.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      # Features requirements are REQUIRED for the suite, not optional: the
      # stream-lock hashes and visual baselines were captured on the
      # with-rembg segmentation path, and most engine tests exercise cv2.
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-features.txt
      # The stream-lock hashes and SSIM baselines are float-sensitive: CI must
      # run the exact numerics stack they were captured on (fixture 07
      # diverged by SSIM 0.0006 on a newer build before these pins).
      - run: pip install 'opencv-python-headless==5.0.0' 'numpy==2.4.6'
      # rembg fetches its U2-Net weights (~170MB) on first use; cache them so
      # every run after the first is warm.
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-weights-v1
      - run: python -m pytest tests -q
      # Audit lint claims are machine-checked (v2 Part 12): any audit carrying a
      # LINT-VERIFY marker has its claimed ruff count re-run and compared, so a
      # miscounted "N findings over every touched file" fails CI instead of
      # surviving four parts the way Parts 7-10's did. Deliberately NOT a bare
      # `ruff check .` gate — the digitizer carries documented pre-existing
      # findings, and gating on zero would fail every build until they're fixed.
      - run: python scripts/verify_lint_claim.py ../../docs/benchmarks

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --workspace apps/frontend
      - run: npm run build --workspace apps/frontend
